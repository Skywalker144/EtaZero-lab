[search]
# Root visit caps include the initial evaluation and any reused visits.
full_search_visits = 400
cheap_search_visits = 70
cheap_search_probs = 0.75
cheap_search_target_weight = 0
reuse_tree = true
clear_before_search = true
max_playouts = 2147483647
max_time = 1e20

[selfplay]
bootstrap_games = 200
recent_games = 256

[puct]
c_puct = 1.05
c_puct_log = 0.28
c_puct_base = 500
c_puct_stdev_prior = 0.40
c_puct_stdev_prior_weight = 2
c_puct_stdev_scale = 0
virtual_loss = 1

[reduce_visits]
reduce_visits = true
reduce_visits_threshold = 0.9
reduce_visits_threshold_lookback = 3
reduced_visits_min = 50
reduced_visits_weight = 0.1

[fpu]
use_fpu = true
fpu_reduction_max = 0.2
root_fpu_reduction_max = 0
fpu_parent_weight_by_visited_policy_pow = 2
fpu_parent_weight_by_visited_policy = true
fpu_parent_weight = 0
fpu_loss_prop = 0
root_fpu_loss_prop = 0

[value_weighting]
value_weight_exponent = 0.5

[forced_playouts]
root_desired_per_child_visits_coeff = 2

[policy_target]
policy_target_pruning = true
chosen_move_subtract = 0
chosen_move_prune = 1

[lcb]
use_lcb = true
lcb_stdevs = 5
min_visit_prop_for_lcb = 0.15

[symmetry]
root_num_symmetries_to_sample = 4
nn_randomize = true
nn_symmetry = 0

[temperature]
nn_policy_temperature = 1
root_policy_temperature_early = 1.5
root_policy_temperature = 1.1
temperature = 0.75
final_temperature = 0.15
temperature_halflife = 15
temperature_only_below_prob = 1

[dirichlet_noise]
dirichlet_total_concentration = 10.83
shaped_dirichlet_noise = true
noise_fraction = 0.25

[opening]
# KataGomo-style balanced opening.
probability = 0.99
avg_dist_factor = 0.8
balance_exponent = 4
rejection_probability = 0.995
rejection_probability_fallback = 0.8
max_tries = 20

[policy_init]
policy_init = true
policy_after = true
policy_on_failure = true
policy_init_mean = 6
policy_temperature = 1.6

[surprise_weighting]
use_search_value_surprise = false
policy_surprise_data_weight = 0.5
value_surprise_data_weight = 0.1

[parallelism]
# Single RTX 5090: keep enough games in flight to feed the shared services.
game_threads = 512
search_threads = 1

[inference]
server_threads = 4
max_batch = 128
inference_precision = float16
cache_entries = 16777216
batch_wait_us = 0
queue_capacity = 256

[writer]
writer_queue = 32
# Cap final repeated training rows, including side rows.
shard_rows = 16384
# KataGo mainb18 firstFileRandMinProp; only the first file uses a random threshold.
first_file_min_random_proportion = 0.15

[graph_search]
use_graph_search = true
graph_search_catch_up_leak_prob = 0

[uncertainty]
use_uncertainty = false
uncertainty_coeff = 0.25
uncertainty_exponent = 1
uncertainty_max_weight = 8

[optimistic_policy]
policy_optimism = 0
root_policy_optimism = 0

[noise_pruning]
use_noise_pruning = false
noise_prune_utility_scale = 0.15
noise_pruning_cap = 1e50

[pda]
normal_asymmetric_playout_prob = 0.01
max_asymmetric_ratio = 8

[side_positions]
side_position_prob = 0.040

[reanalysis]
use_reanalyze = false

# NOVC hint rows: size rule sampling_weight hint_local_index prefix_count prefix_local_indices...
# Relative files resolve against this profile directory. No external corpus means zero probability.
[hint_positions]
hint_positions_prob = 0
positions_file =

[game_forks]
early_fork_game_prob = 0.04
fork_game_prob = 0.01
early_fork_game_expected_move_prop = 0.025
fork_game_min_choices = 3
early_fork_game_max_choices = 12
fork_game_max_choices = 36
