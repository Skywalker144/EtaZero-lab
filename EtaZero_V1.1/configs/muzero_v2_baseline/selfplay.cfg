[selfplay]
bootstrap_games = 200

[search]
full_search_visits = 200
cheap_search_visits = 80
# Deliberate diagnostic difference from V2 exp_baseline: PCR is disabled.
cheap_search_probs = 0
cheap_search_target_weight = 0

[reduce_visits]
reduce_visits = false

[puct]
# V2 scores (Q+1)/2 + U; EtaZero scores Q + U. Double U's coefficients.
# Parent/child visit accounting and initial-visit offsets still differ.
c_puct = 2.5
c_puct_log = 2
c_puct_base = 19652
c_puct_stdev_scale = 0

[fpu]
use_fpu = true
fpu_reduction_max = 0.2
root_fpu_reduction_max = 0
fpu_parent_weight_by_visited_policy_pow = 2
fpu_parent_weight_by_visited_policy = true
fpu_loss_prop = 0
root_fpu_loss_prop = 0

[value_weighting]
value_weight_exponent = 0

[forced_playouts]
root_desired_per_child_visits_coeff = 2

[policy_target]
policy_target_pruning = true
chosen_move_subtract = 0
# Native threshold pruning also changes root value backup; keep that backup off.
chosen_move_prune = 0

[lcb]
use_lcb = true
lcb_stdevs = 5
min_visit_prop_for_lcb = 0.15

[temperature]
nn_policy_temperature = 1.1
root_policy_temperature_early = 1.3
root_policy_temperature = 1.1
temperature = 0.75
final_temperature = 0.15
temperature_halflife = 19

[dirichlet_noise]
dirichlet_total_concentration = 6.75
noise_fraction = 0.25
shaped_dirichlet_noise = true

[opening]
probability = 0.99
avg_dist_factor = 0.8
balance_exponent = 4
rejection_probability = 0.995
rejection_probability_fallback = 0.8
max_tries = 20

[policy_init]
policy_init = true
policy_after = true
policy_on_failure = true
policy_init_mean = 6
policy_temperature = 1.6

[surprise_weighting]
policy_surprise_data_weight = 0.5
value_surprise_data_weight = 0.1
use_search_value_surprise = false

[uncertainty]
use_uncertainty = false

[noise_pruning]
use_noise_pruning = false

[optimistic_policy]
policy_optimism = 0
root_policy_optimism = 0

[pda]
normal_asymmetric_playout_prob = 0

[side_positions]
side_position_prob = 0

[game_forks]
early_fork_game_prob = 0
fork_game_prob = 0

[hint_positions]
hint_positions_prob = 0

[reanalysis]
use_reanalyze = false

[parallelism]
game_threads = 64
search_threads = 1

[inference]
server_threads = 1
max_batch = 32
batch_wait_us = 100
inference_precision = float32
cache_entries = 0

[writer]
writer_queue = 128
# With PCR off, expected repeated-start count matches trajectory-position count.
shard_rows = 32768
