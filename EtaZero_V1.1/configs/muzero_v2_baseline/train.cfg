[unroll]
steps = 5
hidden_gradient_scale = 0.5

[muzero_training]
# Retain main/opponent/soft policy and 0.72 WDL supervision like V2.
# Native TD/optimistic/error losses cannot be disabled independently of these.
auxiliary_losses = true
katago_optimizer = false
learning_rate = 0.001
weight_decay = 0.0003
# Plain mode uses mean-loss gradients and publishes raw weights. V2's EMA
# (128000-sample halflife) is not available with this optimizer configuration.

[optimizer]
kind = adamw

[training]
train_steps = 1000
batch_size = 128
amp = off
gradient_clip = 0
d4_augmentation = true
soft_policy_weight_scale = 8
skip_validation = false
# PCR is explicitly disabled for this diagnostic. Each real position has base
# weight 1, so retain V2's trajectory-row replay ratio without a cheap-row factor.
replay_ratio = 8

[replay]
# With PCR/Reduce Visits off, expected effective rows equal trajectory rows.
# Surprise multiplicity, file boundaries and random caps still differ.
min_rows = 150000
taper_exponent = 0.675
expand_per_row = 0.4
taper_scale = 0
add_to_data_rows = 0
max_rows = all
keep_target_rows = all
