[training]
train_steps = 1000
batch_size = 128
prefetch_depth = 2
cuda_prefetch = true
compile = true
# Save every N successful updates within this iteration; also save at its end.
checkpoint_every = 100
# Keep this many committed round-end checkpoints (including initialization).
checkpoint_keep = 5
amp = off
gradient_clip = 0
replay_ratio = 8
d4_augmentation = true
# KataGo train.py default; opponent heads additionally use the fixed 0.15 factor.
soft_policy_weight_scale = 8
[optimizer]
# SkyZero V8.1's native BN training policy. AdamW is an explicit alternative.
kind = sgd
lr_scale = 1
lr_warmup = true
head_lr_factor = 0.5
noreg_lr_factor = 1
input_wd_factor = 1
normal_wd_factor = 1
norm_interval = 100
lookahead_k = 6
lookahead_alpha = 0.5
# 0 derives half of this run's fixed per-round training sample budget.
swa_period_samples = 0
swa_scale = 8
[replay]
min_rows = 150000
taper_exponent = 0.65
expand_per_row = 0.4
keep_target_rows = 10000000
[shuffle]
workers = 4
group_rows = 32768
bucket_rows = 32768
training_shard_rows = 4096
waves = 1
memory_mb = 2048
temp_dir =
compress_temp = true
snapshot_keep = 2
