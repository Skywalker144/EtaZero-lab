[training]
train_steps = 1000
batch_size = 128
prefetch_depth = 2
checkpoint_every = 100
amp = off
gradient_clip = 0
[optimizer]
type = sgd
learning_rate = 0.01
momentum = 0.9
[loss]
l2 = 0.0001
[replay]
replay_ratio = 8
min_rows = 1024
window_mode = katago
window_rows = 250000
window_min_rows = 1024
window_max_rows = 250000
taper_exponent = 0.65
expand_per_row = 0.4
taper_scale = 1024
shuffle_workers = 4
shuffle_group_rows = 16384
shuffle_bucket_rows = 32768
training_shard_rows = 4096
