[selfplay]
# Training rows only; search and evaluation always retain forbidden features.
forbidden_feature_dropout_prob = 0.5
game_threads = 32
search_threads = 1
max_batch = 32
server_threads = 1
cache_entries = 16384
inference_precision = float32
batch_wait_us = 0
queue_capacity = 256
writer_queue = 32
shard_rows = 4096
flush_seconds = 2
bootstrap_games = 200
recent_games = 256
policy_surprise_data_weight = 0.5
value_surprise_data_weight = 0.1
[search]
simulations = 200
c_puct = 1.5
virtual_loss = 1
reuse_tree = true
clear_before_search = true
cheap_search_probability = 0.75
cheap_search_visits = 100
cheap_search_target_weight = 0
reduce_visits = true
reduce_visits_threshold = 0.9
reduce_visits_threshold_lookback = 3
reduced_visits_min = 20
reduced_visits_weight = 0.1
use_fpu = true
fpu_reduction_max = 0.2
root_fpu_reduction_max = 0
fpu_parent_weight_by_visited_policy_pow = 2
root_desired_per_child_visits_coeff = 2
policy_target_pruning = true
value_weight_exponent = 0.5
chosen_move_subtract = 0
chosen_move_prune = 1
fpu_loss_prop = 0
root_fpu_loss_prop = 0
c_puct_log = 0
c_puct_base = 500
c_puct_stdev_prior = 0.25
c_puct_stdev_prior_weight = 1
c_puct_stdev_scale = 0
root_num_symmetries_to_sample = 4
nn_policy_temperature = 1.1
root_policy_temperature_early = 1.35
root_policy_temperature = 1.15
temperature_halflife = 12
temperature_only_below_prob = 1
use_lcb = true
lcb_stdevs = 5
min_visit_prop_for_lcb = 0.15
[exploration]
dirichlet_total_concentration = 6.75
shaped_dirichlet_noise = true
noise_fraction = 0.25
temperature = 0.75
final_temperature = 0.15

# KataGomo-style balanced opening; independent policy initialization.
[opening]
probability = 0.99
avg_dist_factor = 0.8
balance_exponent = 4
rejection_probability = 0.995
rejection_probability_fallback = 0.8
max_tries = 20
policy_init = false
policy_after = true
policy_on_failure = true
policy_init_mean = 5
policy_temperature = 1
