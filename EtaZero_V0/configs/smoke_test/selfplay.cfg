[search]
# Root visit caps include the initial evaluation and any reused visits.
full_search_visits = 9
cheap_search_visits = 4

[selfplay]
bootstrap_games = 4

[reduce_visits]
reduced_visits_min = 2

[temperature]
temperature_halflife = 8

[dirichlet_noise]
dirichlet_total_concentration = 0.3

[parallelism]
game_threads = 4
search_threads = 2

[inference]
inference_precision = float32
max_batch = 8

[writer]
writer_queue = 4
shard_rows = 64
first_file_min_random_proportion = 1

[pda]
# Tiny smoke budgets cannot meet the source PDA minimum of 5 visits.
normal_asymmetric_playout_prob = 0

# Keep the existing tiny smoke acceptance fixture on ordinary starts.
[game_forks]
early_fork_game_prob = 0
fork_game_prob = 0
