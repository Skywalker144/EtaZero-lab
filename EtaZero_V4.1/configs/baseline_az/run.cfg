# V3.4 adaptive sampling and bounded training credit; iteration 0 is bootstrap.
[run]
bootstrap_games = 800
train_steps = 2000
replay_ratio = 4
bootstrap_game_multiplier = 1.05
publish_weights = swa
# Optional: set iterations or max_hours in the selected profile or on the command line.

# Outer-only names below have no native KataGo equivalent.
auto_plot = true
gatekeeper_required_win_prop = 0.5
# game / algorithm: owned by env.cfg / selfplay.cfg.
# selfplay_config / train_config / shuffle_config: default to files in that directory.
# gatekeeper_config: unset (directly accept published models).
# run_dir: default configs-to-data directory mapping.
# iterations / max_hours: optional cumulative limits; omit both to run indefinitely.
