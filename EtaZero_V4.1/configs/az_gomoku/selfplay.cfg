@include ../baseline_az/selfplay.cfg

# Gomoku-specific overrides of the shared V4 baseline.
[search]
maxVisits = 100
cheapSearchProb = 0
cheapSearchVisits = 75

[temperature]
chosenMoveTemperatureHalflife = 12

[subtree_value_bias]
subtreeValueBiasFactor = 0.45
subtreeValueBiasWeightExponent = 0.85

[reduce_visits]
reducedVisitsMin = 25

[policy_init]
balanceOpeningProb = 0.99
balanceOpeningDropPow = 4
policyInitAvgMoveNum = 6
policyInitAreaTemperature = 1.6

[parallelism]
numGameThreads = 512

[inference]
numNNServerThreadsPerModel = 2
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 23
cudaUseFP16 = true

[handicap]
handicapProb = 0
