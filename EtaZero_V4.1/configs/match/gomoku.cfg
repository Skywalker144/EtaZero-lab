@include common.cfg

# Freestyle rules and the existing V4 Gomoku evaluation board distribution.
# To evaluate Standard or Renju models, override game in the task config.
game = freestyle
bSizes = 15,14,13,12,11
bSizeRelProbs = 100,10,5,3,1
allowRectangleProb = 0
komiMean = 0
handicapProb = 0

# KataGomo match opening; no policy prefix after the balanced position.
balanceOpeningProb = 1
balanceOpeningDropPow = 10
initGamesWithPolicy = false
chosenMoveTemperatureHalflife = 12
