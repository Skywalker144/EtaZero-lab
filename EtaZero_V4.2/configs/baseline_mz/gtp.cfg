@include ../baseline_az/gtp.cfg

# Latent search has no real-board transposition/pattern identity.
useMuZero = true
useGraphSearch = false
subtreeValueBiasFactor = 0
avoidRepeatedPatternUtility = 0
# The ordinary evaluator cache is also off in this profile. MuZero roots use muZeroCacheSizePowerOfTwo.
nnCacheSizePowerOfTwo = -1
