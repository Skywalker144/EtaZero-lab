@include ../az_g/selfplay.cfg

# KataGo selfplay1 visit budgets; retain the inherited mainb18 PUCT settings.
[search]
full_search_visits = 600
cheap_search_visits = 100

[reduce_visits]
reduced_visits_min = 100

# Both KataGo selfplay1 and mainb18 use these temperature and bias settings.
[temperature]
temperature_halflife = 19

[subtree_value_bias]
subtree_value_bias_factor = 0.30
subtree_value_bias_weight_exponent = 0.8

[policy_init]
# KataGo policyInitAreaTemperature defaults to 1.
policy_temperature = 1

[opening]
probability = 0
