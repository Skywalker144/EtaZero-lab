# Engineering starting configuration; formal experiment parameters are user-selected.

[run]
# Output defaults to data/<path relative to configs/>; run_dir can override it.

# Budget
max_iteration = 0
max_seconds = 0

# Seed
seed = 1

# CPU threads
cpu_threads = 2

[agent]
algorithm = alphazero
root_search_algo = puct
nonroot_search_algo = puct

[devices]
train = cuda:0
selfplay = cuda:0
