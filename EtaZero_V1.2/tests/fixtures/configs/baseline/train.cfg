[training]
train_steps = 1000
sub_epochs = 1
batch_size = 128
replay_ratio = 8

d4_augmentation = true
no_repeat_files = false

amp = off
compile = true
gradient_clip = 0

prefetch_depth = 2
cuda_prefetch = true

checkpoint_every = 100
checkpoint_keep = 5

skip_validation = false
randomize_validation_files = false
max_validation_samples = 0

disable_optimistic_policy = false
soft_policy_weight_scale = 8

[optimizer]
kind = sgd

lr_scale = 1
lr_warmup = true
head_lr_factor = 0.5
noreg_lr_factor = 1

input_wd_factor = 1
normal_wd_factor = 1
normal_attn_wd_factor = 1

norm_interval = 100
norm_only_at_print = true

lookahead_print = false
lookahead_k = 6
lookahead_alpha = 0.5

swa_period_samples = 0
swa_scale = 8

[replay]
min_rows = 150000
taper_exponent = 0.8
expand_per_row = 0.3
taper_scale = 0
add_to_data_rows = 0
max_rows = all

keep_target_rows = 20000000

[shuffle]
workers = 12
memory_mb = 16384

group_rows = 65536
bucket_rows = 65536
training_shard_rows = 65536

waves = 1
temp_dir =
compress_temp = true

snapshot_keep = 2
