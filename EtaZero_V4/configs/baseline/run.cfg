# Single-machine synchronous example, expressed through the V4 outer scheduler.
# Sampling/bootstrap retain the synchronous starting point; replay ratio follows V3.4.
# V4 adapts later game counts to replay credit; this is not the native train bucket.
[run]
games_per_round = 500
replay_ratio = 4
bootstrap_min_rows = 100000
publish_weights = swa
# Set iterations or max_hours in the selected profile or on the command line.

# Outer-only names below have no native KataGo equivalent.
auto_plot = true
gatekeeper_required_win_prop = 0.5
# game / algorithm: owned by env.cfg / selfplay.cfg.
# selfplay_config / train_config / shuffle_config: default to files in that directory.
# gatekeeper_config: unset (directly accept published models).
# run_dir: default configs-to-data directory mapping.
# iterations / max_hours: caller-selected cumulative budget, no default.
