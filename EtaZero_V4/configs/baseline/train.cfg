# Native parameter names, grouped by responsibility.

[training]
batch-size = 128
samples-per-epoch = 100000
# V4 caps each round at five complete epochs (target 500000 samples).
# Native synchronous_loop instead stops by train-bucket and no-repeat-files.
# V4 owns replay credit and uses the native reader's default file repetition.
max-epochs-this-instance = 5

# Reload training data up to this many times per epoch
sub-epochs = 1

[optimizer]
# LR factor for muon-ineligible (adam) params when using muon
muon-adam-lr-factor = 1.0

# Multiplier on gradient clipping threshold
gnorm-clip-scale = 1.0

# Use adamw optimizer
use-adamw =

# Use muon optimizer
use-muon =

# Use normuon optimizer (muon with neuron-wise normalization)
use-normuon =

# Use aurora optimizer (leverage-aware muon variant)
use-aurora =

# Number of preconditioning-polar iterations for aurora
aurora-pp-iterations = 2

# Damping parameter for aurora diagonal preconditioner
aurora-pp-beta = 0.5

# Number of Newton-Schulz iterations for muon/normuon/aurora
ns-steps = 5

# Use Polar Express iteration instead of standard NS5 for muon/normuon/aurora
use-polar-express =

[learning_rate]
# input-features: supplied/owned by the outer controller.

# LR multiplier on the hardcoded schedule
lr-scale = 1.0

# LR auto scaling
lr-scale-auto =

# LR auto scaling 2
lr-scale-auto2 =

# Explicit piecewise-constant LR scale schedule as (global_step_samples,lr_scale) points, e.g
lr-schedule =

# Cyclic LR scale keyed to the export cycle: LR scale at the bottom of the cycle
lr-cycle-low =

# Cyclic LR scale: LR scale at the top of the cycle
lr-cycle-high =

# Cyclic LR scale: number of epochs at the start of each export cycle to ramp up
lr-cycle-up-epochs =

# Cyclic LR scale: number of epochs at the end of each export cycle to ramp down
lr-cycle-down-epochs =

# LR factor for output head weights
head-lr-factor = 0.5

# LR factor for noreg params (biases, norms)
noreg-lr-factor = 1.0

# quit-if-no-data: supplied/owned by the outer controller.

# Disable LR warmup schedule
no-lr-warmup =

[weight_decay]
# Extra scaling factor for input weight decay
input-wd-factor = 1.0

# Extra scaling factor for normal weight decay
normal-wd-factor = 1.0

# Extra scaling factor for normal_attn weight decay
normal-attn-wd-factor = 1.0

# Exempt from weight decay the part of each output channel of each weight matrix whose RMS is below this fraction of the tensor's RMS at initialization, so that unused channels never decay to exactly zero, a state Muon cannot recover from
wd-floor-frac =

[lookahead]
# Use lookahead optimizer
lookahead-k = 6

# Use lookahead optimizer
lookahead-alpha = 0.5

# Only print on lookahead syncs
lookahead-print =

[swa]
swa-period-samples = 80000

# Number of samples to average in expectation together for SWA
swa-scale = 8

[precision]
# multi-gpus: supplied/owned by the outer controller.

# Use fp16 AMP training (with gradient scaler)
use-fp16 =

# Use bf16 AMP training (no gradient scaler)
use-bf16 =

# Do not torch.compile
no-compile =

# Reduce float32 precision for speed on some gpus
use-tf32-matmul =

[loss]
# Optimizer, LR, Lookahead, SWA scale, compilation and precision use train.py defaults.

# Native options: empty assignment leaves the option unset.
# With use-adamw/use-muon/use-normuon/use-aurora unset, the native optimizer is SGD.
# With use-fp16/use-bf16 unset, training is FP32; no-compile unset enables compilation.
# For boolean CLI flags, a bare name enables it; an empty assignment disables it.
# Unset network-dependent values are resolved by the native consumer.

# traindir: supplied/owned by the outer controller.

# datadir: supplied/owned by the outer controller.

# latestdatadir: supplied/owned by the outer controller.

# exportdir: supplied/owned by the outer controller.

# exportprefix: supplied/owned by the outer controller.

# initial-checkpoint: supplied/owned by the outer controller.

# initial-weights: supplied/owned by the outer controller.

# initialize-only: supplied/owned by the outer controller.

# always-initial-checkpoint: supplied/owned by the outer controller.

# required-initial-checkpoint-train-steps: supplied/owned by the outer controller.

# Hidden gradient multiplier after the first recurrent edge; defaults to checkpoint value or 0.5
muzero-hidden-gradient-scale =

# Soft policy loss coeff
soft-policy-weight-scale = 8.0

# Disable optimistic policy
disable-optimistic-policy =

# Mask soft policy on non-kata rows using sgfmeta
meta-kata-only-soft-policy =

# Additional value loss coeff
value-loss-scale = 0.6

# Additional td value loss coeffs, 3 comma separated values
td-value-loss-scales = 0.6,0.6,0.6

# Additional variance time loss coeff
variance-time-loss-scale = 1.0

# Loss factor scale for main head
main-loss-scale =

# Loss factor scale for intermediate head
intermediate-loss-scale =

[validation]
# Approx max of validation samples per epoch
max-val-samples =

# Randomize order of validation files
randomize-val =

[checkpoints]
# Export model once every this many epochs
epochs-per-export =

# no-export: supplied/owned by the outer controller.

# Do not save the periodic archival checkpoints in longterm_checkpoints/
no-longterm-checkpoints =

[data]
# export-prob: supplied/owned by the outer controller.

# max-training-samples: supplied/owned by the outer controller.

# Sleep this long between epochs
sleep-seconds-per-epoch =

# When data added, add this many train rows per data row to bucket
max-train-bucket-per-new-data =

# Approx total number of train rows allowed if data stops
max-train-bucket-size =

# Train rows initially in the bucket when the checkpoint has no bucket state yet, default samples-per-epoch
initial-train-bucket-level =

# Approx total of training allowed if shuffling stops
max-train-steps-since-last-reload =

# Terminate due to train bucket rather than waiting for more
stop-when-train-bucket-limited =

# Number of training data files to prefetch ahead of the one being consumed, to hide disk+decompress latency at file boundaries
data-prefetch-depth = 1

# Track what shuffled data was used and do not repeat, even when killed and resumed
no-repeat-files =

[brenorm]
# gnorm-stats-debug: supplied/owned by the outer controller.

# Set brenorm running avg rate to this value
brenorm-avg-momentum =

# Gradually adjust brenorm rmax to this value
brenorm-target-rmax =

# Gradually adjust brenorm dmax to this value
brenorm-target-dmax =

# How many samples to adjust brenorm params all but 1/e of the way to target
brenorm-adjustment-scale =

[attention]
# Penalize attention layers whose per-head logit upper bound (scale * max||q|| * max||k||, incl off-board positions) exceeds this
attn-logit-penalty-cap =

# Loss coeff for the attention logit bound penalty (linear hinge, mean over heads, sum over layers, per sample)
attn-logit-penalty-coeff = 0.001

# Compute the attention logit penalty on only this fraction of each batch (cuts its cost proportionally, adds gradient variance)
attn-logit-penalty-batch-frac = 1.0
