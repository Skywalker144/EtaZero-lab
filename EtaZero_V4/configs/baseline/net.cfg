# Preset names come directly from katago/train/modelconfigs.py.
[network]
architecture = b5c192nbt-fson-mish

# MuZero uses KataGo NBT blocks; b5c128nbt is the V4 width preset aligned with V3.4.
# Active only for the MuZero family. Game and component versions derive from env.cfg.
[muzero]
representation = b5c128nbt-fson-mish
dynamics = b5c128nbt-fson-mish
prediction = b5c128nbt-fson-mish
prediction_blocks = 0  # 0: hidden directly enters heads; >0: preset trunk with this block count.
latent_channels = 128
unroll_steps = 5
