# Native parameter names, grouped by responsibility.

[replay]
keep-target-rows = 600000
min-rows = 100000
expand-window-per-row = 0.4
taper-window-exponent = 0.65
taper-window-scale = 50000

# Native options: empty assignment leaves the option unset.
# For boolean CLI flags, a bare name enables it; an empty assignment disables it.
# Unset network-dependent values are resolved by the native consumer.

# Maximum size of the desired training window, default unbounded
max-rows =

# Compute the window size as if the number of data rows were this much larger/smaller
add-to-data-rows = 0

[workers]
num-processes = 8

# Expand complete MuZero trajectories into K future target steps; 0 selects ordinary AlphaZero data

# If > 1, shuffle in this many waves to bound peak intermediate shard count and temp disk usage for very large (whole-dataset) shuffles
num-waves = 1

# dry-run-print-resource-cost: supplied/owned by the outer controller.

# Internally, target having many rows per parallel sharding worker (doesnt affect merge)
worker-group-size = 80000

[output]
approx-rows-per-out-file = 70000

# out-dir: supplied/owned by the outer controller.

# out-tmp-dir: supplied/owned by the outer controller.

# Each merge worker takes one whole bucket in RAM and splits it equally into output files
approx-rows-per-bucket =

# Include sgf metadata inputs
include-meta =

# Exclude Q-value targets (for backwards compatibility with pre-v1.16)
exclude-qvalues =

[filtering]
# Summary json file for directory contents
summary-file =

# Text file with npzs to ignore, one per line
exclude =

# Prefix to concat to lines in exclude to produce the full file path
exclude-prefix =

# Consider an exclude to match if basename matches
exclude-basename =

# Just before sharding, include only filepaths hashing to float >= this
only-include-md5-path-prop-lbound = 0.0

# Just before sharding, include only filepaths hashing to float < this
only-include-md5-path-prop-ubound = 1.0
skip-mtime-range-start =
skip-mtime-range-end =
