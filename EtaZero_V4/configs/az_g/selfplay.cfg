@include ../algorithms/az/selfplay.cfg

# V3.4 Gomoku baseline, expressed with V4 native parameter names.
[search]
maxVisits = 375
cheapSearchVisits = 75
clearBotBeforeSearch = true
useUncertainty = false
useNoisePruning = false
policyOptimism = 0
rootPolicyOptimism = 0

[puct]
cpuctExploration = 1.05
cpuctExplorationLog = 0.28
cpuctExplorationBase = 500
cpuctUtilityStdevPrior = 0.40
cpuctUtilityStdevPriorWeight = 2
cpuctUtilityStdevScale = 0

[temperature]
chosenMoveTemperatureHalflife = 15
rootPolicyTemperatureEarly = 1.5

[subtree_value_bias]
subtreeValueBiasFactor = 0.45
subtreeValueBiasWeightExponent = 0.85
subtreeValueBiasFreeProp = 0.8

[reduce_visits]
reducedVisitsMin = 50

[policy_init]
balanceOpeningProb = 0.99
balanceOpeningDropPow = 4
policyInitAvgMoveNum = 6
policyInitAreaTemperature = 1.6

[parallelism]
numGameThreads = 512

[inference]
numNNServerThreadsPerModel = 2
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 23
cudaUseFP16 = true

[writer]
maxDataQueueSize = 32
maxRowsPerTrainFile = 16384

[handicap]
handicapProb = 0
