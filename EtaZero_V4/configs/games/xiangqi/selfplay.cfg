# Groups organize native parameter names; values and include order are unchanged.

[search]
numSearchThreads = 1
maxVisits = 16
cheapSearchProb = 0
cheapSearchVisits = 4
cheapSearchTargetWeight = 1

[symmetry]
rootNumSymmetriesToSample = 1

[utility]
avoidRepeatedPatternUtility = 0

[subtree_value_bias]
subtreeValueBiasFactor = 0

# Groups organize native parameter names; values and include order are unchanged.

[logging]
logSearchInfo = false
logMoves = false
logGamesEvery = 1
logToStdout = true

[writer]
maxDataQueueSize = 16
maxRowsPerTrainFile = 128
firstFileRandMinProp = 1

[game_forks]
earlyForkGameProb = 0
earlyForkGameExpectedMoveProp = 0.025
forkGameProb = 0
forkGameMinChoices = 3
earlyForkGameMaxChoices = 12
forkGameMaxChoices = 36

[policy_init]
initGamesWithPolicy = false

[side_positions]
sidePositionProb = 0


[reduce_visits]
reduceVisits = false
reduceVisitsThreshold = 0.9
reduceVisitsThresholdLookback = 3
reducedVisitsMin = 4
reducedVisitsWeight = 0.1

[pda]
handicapAsymmetricPlayoutProb = 0
normalAsymmetricPlayoutProb = 0
maxAsymmetricRatio = 2

[surprise_weighting]
policySurpriseDataWeight = 0.5
valueSurpriseDataWeight = 0.1

[parallelism]
numGameThreads = 2
maxMovesPerGame = 24
switchNetsMidGame = false

[inference]
nnMaxBatchSize = 4
nnCacheSizePowerOfTwo = 10
nnMutexPoolSizePowerOfTwo = 8
cudaUseFP16 = true
cudaUseNHWC = true

