# Independent evaluation profile; autoelo supplies models and pairings.
@include ../../cpp/configs/training/gatekeeper1.cfg

game = freestyle
bSizes = 15,14,13,12,11
bSizeRelProbs = 100,10,5,3,1
allowRectangleProb = 0
komiMean = 0
# KataGomo df152116 match opening: always balance, with a sharper value filter.
balanceOpeningProb = 1
balanceOpeningDropPow = 10
chosenMoveTemperatureHalflife = 12

# All models in this game use the same fixed evaluation search budget.
maxVisits = 100
numSearchThreads = 1
useMuZero = false
rootSearchAlgorithm = puct
nonrootSearchAlgorithm = puct
rootNoiseEnabled = false
rootDesiredPerChildVisitsCoeff = 0
rootNumSymmetriesToSample = 4
