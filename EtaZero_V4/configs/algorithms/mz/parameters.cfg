# V3.4 ordinary MuZero search/execution settings. Network structure is configured separately.
[search]
maxVisits = 250
cheapSearchProb = 0
numSearchThreads = 1

[graph_search]
useGraphSearch = false

[subtree_value_bias]
subtreeValueBiasFactor = 0

[symmetry]
rootNumSymmetriesToSample = 1

[inference]
numNNServerThreadsPerModel = 2
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = -1
cudaUseFP16 = true
# V4's native batcher has no V3.4 queue-capacity or batch-wait configuration.

[parallelism]
numGameThreads = 256
