# Native inference fragment shared by Gumbel AZ and Gumbel MuZero.
rootSearchAlgorithm = gumbel
nonrootSearchAlgorithm = gumbel
useGraphSearch = false

# Evaluation uses sequential halving without root Gumbel/Dirichlet noise.
rootNoiseEnabled = false
rootDirichletNoiseWeight = 0
analysisWideRootNoise = 0
rootDesiredPerChildVisitsCoeff = 0
useLcbForSelection = false
chosenMoveSubtract = 0
chosenMovePrune = 0
chosenMoveTemperatureEarly = 0
chosenMoveTemperature = 0
rootPolicyTemperatureEarly = 1
rootPolicyTemperature = 1

gumbelMaxConsideredActions = 16
gumbelCVisit = 50
gumbelCScale = 0.1
gumbelRescaleQ = true
gumbelNoiseScale = 0
gumbelSampleVisits = false
