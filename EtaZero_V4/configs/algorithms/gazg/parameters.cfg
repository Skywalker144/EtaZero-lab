# V3.4 Gumbel selfplay settings, expressed using V4 native search options.
[search]
maxVisits = 33  # One root evaluation plus 32 action visits before any budget scaling.
cheapSearchVisits = 32
cheapSearchProb = 0
cheapSearchTargetWeight = 0

[reduce_visits]
reduceVisits = false

[graph_search]
useGraphSearch = false

[dirichlet_noise]
# This enables Gumbel noise in V4; no Dirichlet noise is added by the Gumbel root.
rootNoiseEnabled = true
rootDirichletNoiseWeight = 0

[forced_playouts]
rootDesiredPerChildVisitsCoeff = 0

[policy_target]
chosenMoveSubtract = 0
chosenMovePrune = 0

[lcb]
useLcbForSelection = false

[temperature]
rootPolicyTemperatureEarly = 1
rootPolicyTemperature = 1
chosenMoveTemperatureEarly = 0
chosenMoveTemperature = 0

[gumbel]
gumbelMaxConsideredActions = 16
gumbelCVisit = 50
gumbelCScale = 0.1
gumbelRescaleQ = true
gumbelNoiseScale = 1
gumbelSampleVisits = false
