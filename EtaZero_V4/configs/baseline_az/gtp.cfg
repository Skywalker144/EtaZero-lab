# Native GTP/Web inference. Independent of the sectioned training configs.
# Reference: KataGo d91ea855, cpp/configs/gtp_example.cfg and SETUP_FOR_GTP defaults.
# V4 omits removed score/ownership/pass hacks; root symmetry sampling retains 4.
game = go
rules = tromp-taylor
defaultBoardXSize = 19
defaultBoardYSize = 19
maxBoardSizeForNNBuffer = 19

useMuZero = false
rootSearchAlgorithm = puct
nonrootSearchAlgorithm = puct

# Interactive budget, not the selfplay budget. Tune threads on the actual device.
maxVisits = 500
numSearchThreads = 6
ponderingEnabled = false
maxTimePondering = 60
lagBuffer = 1.0
searchFactorWhenWinning = 0.40
searchFactorWhenWinningThreshold = 0.95
allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 3
resignMinMovesPerBoardArea = 0

# Analysis-only widening is separate from selfplay Dirichlet noise.
analysisPVLen = 15
reportAnalysisWinratesAs = SIDETOMOVE
analysisWideRootNoise = 0.04
analysisIgnorePreRootHistory = true
rootSymmetryPruning = true
rootNumSymmetriesToSample = 4

rootNoiseEnabled = false
rootDirichletNoiseTotalConcentration = 10.83
rootDirichletNoiseWeight = 0.25
rootDesiredPerChildVisitsCoeff = 0
rootPolicyTemperatureEarly = 1
rootPolicyTemperature = 1
chosenMoveTemperatureEarly = 0.5
chosenMoveTemperature = 0.10
chosenMoveTemperatureHalflife = 19
chosenMoveSubtract = 0
chosenMovePrune = 1

useLcbForSelection = true
useNonBuggyLcb = true
lcbStdevs = 5
minVisitPropForLCB = 0.15

winLossUtilityFactor = 1
noResultUtilityForWhite = 0
drawEquivalentWinsForWhite = 0.5
cpuctExploration = 1.0
cpuctExplorationLog = 0.45
cpuctExplorationBase = 500
cpuctUtilityStdevPrior = 0.40
cpuctUtilityStdevPriorWeight = 2
cpuctUtilityStdevScale = 0.85
fpuReductionMax = 0.2
rootFpuReductionMax = 0.1
fpuParentWeightByVisitedPolicy = true
fpuParentWeightByVisitedPolicyPow = 2
fpuLossProp = 0
rootFpuLossProp = 0

policyOptimism = 1.0
rootPolicyOptimism = 0.2
nnPolicyTemperature = 1
useUncertainty = true
uncertaintyExponent = 1
uncertaintyCoeff = 0.25
uncertaintyMaxWeight = 8
useNoisePruning = true
noisePruneUtilityScale = 0.15
noisePruningCap = 1e50
valueWeightExponent = 0.25

subtreeValueBiasFactor = 0.45
subtreeValueBiasWeightExponent = 0.85
subtreeValueBiasFreeProp = 0.8
useGraphSearch = true
nodeTableShardsPowerOfTwo = 16
numVirtualLossesPerThread = 1
avoidRepeatedPatternUtility = 0
playoutDoublingAdvantage = 0

# Batch size is inferred from search concurrency by the native backend.
numNNServerThreadsPerModel = 1
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
cudaUseFP16 = auto
cudaUseNHWC = true

# stderr keeps GTP stdout clean and avoids creating logs in configs/.
logAllGTPCommunication = true
logSearchInfo = true
logSearchInfoForChosenMove = false
logToStdout = false
logToStderr = true
