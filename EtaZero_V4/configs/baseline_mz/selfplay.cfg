@include ../baseline_az/selfplay.cfg

[agent]
algorithm = muzero

# MuZero search and inference overrides. Root symmetry sampling inherits the common limit.
[search]
maxVisits = 250
cheapSearchProb = 0

[graph_search]
useGraphSearch = false

[subtree_value_bias]
subtreeValueBiasFactor = 0

[inference]
numNNServerThreadsPerModel = 2
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = -1
cudaUseFP16 = true
# V4's native batcher has no V3.4 queue-capacity or batch-wait configuration.

[parallelism]
numGameThreads = 256
