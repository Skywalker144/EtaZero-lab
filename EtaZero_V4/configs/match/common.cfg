# Native match settings shared by the four game profiles in this directory.
# Values follow the existing V4 independent PUCT evaluations and their
# KataGo gatekeeper1 search/inference settings. No training config is included.
# Participants, model paths, pairings and game counts belong to the match task.

# Logging and execution
logSearchInfo = false
logMoves = false
logGamesEvery = 10
logToStdout = true
numGameThreads = 128
maxMovesPerGame = 1600
clearBotBeforeSearch = false

# Resignation
allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 5

# Fixed visit budget, independent of the training search budget.
maxVisits = 100
numSearchThreads = 1
useMuZero = false
rootSearchAlgorithm = puct
nonrootSearchAlgorithm = puct

# Evaluation has no root exploration noise or forced root visits.
rootNoiseEnabled = false
rootDesiredPerChildVisitsCoeff = 0
rootPolicyTemperatureEarly = 1
rootPolicyTemperature = 1
rootSymmetryPruning = false
rootNumSymmetriesToSample = 4

# Move selection; each game specifies its temperature half-life.
chosenMoveTemperatureEarly = 0.5
chosenMoveTemperature = 0.2
chosenMoveSubtract = 0
chosenMovePrune = 1
useLcbForSelection = true
useNonBuggyLcb = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# W/D/L/NR utility and PUCT
winLossUtilityFactor = 1.0
noResultUtilityForWhite = 0.0
noResultStdev = 0.0
drawEquivalentWinsForWhite = 0.5
cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.1
valueWeightExponent = 0.5
policyOptimism = 1.0
rootPolicyOptimism = 0.0
nnPolicyTemperature = 1.0
useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25
useNoisePruning = true
numVirtualLossesPerThread = 1

# Ordinary PUCT real-board search. MuZero bots must explicitly override
# useGraphSearchN=false and subtreeValueBiasFactorN=0 in the task config.
# Gumbel bots also require useGraphSearchN=false and their selection settings.
useGraphSearch = true
subtreeValueBiasFactor = 0.35
subtreeValueBiasWeightExponent = 0.8
avoidRepeatedPatternUtility = 0

# Neural inference; device selection and random seeds may be supplied by tasks.
nnMaxBatchSize = 128
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 15
numNNServerThreadsPerModel = 1
nnRandomize = true
cudaUseFP16 = auto
cudaUseNHWC = auto
