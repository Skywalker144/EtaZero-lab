@include ../baseline/match.cfg

[match]
# Common model-strength evaluation, independent of each training budget.
board_size = 15
rule = freestyle
visits = 100
device = cuda:0
inference_precision = float16
reuse_tree = false
use_graph_search = false
root_num_symmetries_to_sample = 1
cache_entries = 0
game_threads = 20
search_threads = 1
cpu_threads = 1
server_threads = 1
max_batch = 32
batch_wait_us = 100
queue_capacity = 1024
