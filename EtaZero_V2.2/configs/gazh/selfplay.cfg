[search]
full_search_visits = 32
cheap_search_visits = 32
cheap_search_probs = 0
reuse_tree = false

[reduce_visits]
# Keep ordinary searches at the full budget; inherited minimum is 50.
reduce_visits = false

[graph_search]
use_graph_search = false

# Gumbel supplies root exploration, visit allocation and policy targets.
[dirichlet_noise]
noise_fraction = 0
shaped_dirichlet_noise = false

[forced_playouts]
root_desired_per_child_visits_coeff = 0

[policy_target]
policy_target_pruning = false
chosen_move_subtract = 0
chosen_move_prune = 0

[lcb]
use_lcb = false

[temperature]
root_policy_temperature_early = 1
root_policy_temperature = 1
# SH selects the move; no additional visit-temperature sampling.
temperature = 0
final_temperature = 0

[gumbel]
max_num_considered_actions = 16
c_visit = 50
c_scale = 0.1
rescale_q_values = true
noise_scale = 1
# gumbel: SH winner; visit: sample visits using the existing move temperature.
action_selection = gumbel
