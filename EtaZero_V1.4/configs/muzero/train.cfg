[muzero_training]
auxiliary_losses = true
katago_optimizer = false
learning_rate = 0.001
weight_decay = 0.0003

[optimizer]
kind = adamw

[unroll]
steps = 5
hidden_gradient_scale = 0.5

[shuffle]
# Unrolled rows are larger than AlphaZero rows; fit the inherited memory budget.
training_shard_rows = 8192

[training]
# KataGo AdamW cap converted from batch-sum to batch-mean gradients:
# 11000 * sqrt(128 / 256) / 128 = 60.766989, for one GPU and lr_scale=1.
# Recompute this threshold if the batch size changes.
gradient_clip = 60.766989
