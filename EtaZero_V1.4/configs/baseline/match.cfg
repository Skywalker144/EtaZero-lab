@include engine.cfg

[match]
rule = freestyle
games = 40
game_threads = 8

[opening]
# Balanced opening
probability = 1
avg_dist_factor = 0.8
balance_exponent = 10
rejection_probability = 0.995
rejection_probability_fallback = 0.8
max_tries = 20

# Policy initialization
policy_init = false
policy_after = true
policy_on_failure = true
policy_temperature = 1

[hex_opening]
probability = 1
make_fair_probability = 1
balance_exponent = 20
min_accept_rate = 0.001
