# Shared analysis and match settings. Mode profiles override only their differences.
[engine]
board_size = 15
rule = renju
seed = 1

visits = 500
max_playouts = 2147483647
max_time = 1e20
reuse_tree = true

c_puct = 1.0
c_puct_log = 0.45
c_puct_base = 500
c_puct_stdev_prior = 0.40
c_puct_stdev_prior_weight = 2
c_puct_stdev_scale = 0.85
virtual_loss = 1

use_fpu = true
fpu_reduction_max = 0.2
root_fpu_reduction_max = 0.1
fpu_parent_weight_by_visited_policy_pow = 2
fpu_parent_weight_by_visited_policy = true
fpu_parent_weight = 0
fpu_loss_prop = 0
root_fpu_loss_prop = 0

value_weight_exponent = 0.25

policy_target_pruning = true
chosen_move_subtract = 0
chosen_move_prune = 1

use_lcb = true
lcb_stdevs = 5
min_visit_prop_for_lcb = 0.15

root_num_symmetries_to_sample = 1
nn_randomize = true
nn_symmetry = 0

nn_policy_temperature = 1
root_policy_temperature_early = 1
root_policy_temperature = 1
temperature_early = 0.60
temperature = 0.20
temperature_halflife = 19
temperature_only_below_prob = 1

use_graph_search = true
graph_search_catch_up_leak_prob = 0

use_uncertainty = true
uncertainty_coeff = 0.25
uncertainty_exponent = 1
uncertainty_max_weight = 8

policy_optimism = 1
root_policy_optimism = 0.2

use_noise_pruning = true
noise_prune_utility_scale = 0.15
noise_pruning_cap = 1e50

playout_doubling_advantage = 0
playout_doubling_advantage_player = black

device = cuda:0
cpu_threads = 1
search_threads = 1

server_threads = 1
max_batch = 32
inference_precision = auto
cache_entries = 65536
batch_wait_us = 0
queue_capacity = 1024
