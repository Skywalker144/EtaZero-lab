[training]
# Training budget
train_steps = 4
batch_size = 8
replay_ratio = 0.25

# Precision and compilation
compile = false

# Batch prefetch
prefetch_depth = 1

# Checkpoints
checkpoint_every = 2

[optimizer]
# Norm statistics
norm_interval = 2

# Lookahead
lookahead_k = 2

# SWA
swa_period_samples = 8

[replay]
# Window
min_rows = 32

# Snapshot sampling
keep_target_rows = 256

[shuffle]
# Workers and memory
workers = 2

# Groups and output shards
group_rows = 128
bucket_rows = 64
training_shard_rows = 32
