@include ../mz_g/train.cfg
# Common losses, unroll, replay and training budget.
# Each arm explicitly selects the optimization path and optimizer kind.

[muzero_training]
auxiliary_losses = true
katago_optimizer = true
# Fixed LR/WD for the plain optimizer control arms.
learning_rate = 0.001
weight_decay = 0.0003

[training]
# Plain controls retain their batch-mean gradient cap (batch size 128).
# KataGo arms override this with their automatic batch-sum cap.
gradient_clip = 60.766989
