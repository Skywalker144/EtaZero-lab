[muzero_training]
auxiliary_losses = true
katago_optimizer = false
learning_rate = 0.001
weight_decay = 0.0003

[optimizer]
kind = adamw

[unroll]
steps = 5
hidden_gradient_scale = 0.5

[shuffle]
# Unrolled rows are larger than AlphaZero rows; fit the inherited memory budget.
training_shard_rows = 8192
