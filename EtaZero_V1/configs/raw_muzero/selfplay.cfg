[search]
# Playout Cap Randomization off: every real move uses full_search_visits.
cheap_search_probs = 0

[reduce_visits]
reduce_visits = false

[puct]
c_puct_stdev_scale = 0

[fpu]
use_fpu = false

[value_weighting]
value_weight_exponent = 0

[forced_playouts]
root_desired_per_child_visits_coeff = 0

[policy_target]
policy_target_pruning = false
# These also affect noisy-root value backup independently of target pruning.
chosen_move_subtract = 0
chosen_move_prune = 0

[lcb]
use_lcb = false

[symmetry]
nn_randomize = true
root_num_symmetries_to_sample = 1

[temperature]
nn_policy_temperature = 1
root_policy_temperature_early = 1
root_policy_temperature = 1

[dirichlet_noise]
# Ordinary Dirichlet exploration stays on; policy-shaped alpha is off.
shaped_dirichlet_noise = false

[opening]
probability = 0

[policy_init]
policy_init = false

[surprise_weighting]
policy_surprise_data_weight = 0
value_surprise_data_weight = 0

[uncertainty]
use_uncertainty = false

[optimistic_policy]
policy_optimism = 0
root_policy_optimism = 0

[noise_pruning]
use_noise_pruning = false

[pda]
normal_asymmetric_playout_prob = 0

[side_positions]
side_position_prob = 0

[reanalysis]
use_reanalyze = false

[hint_positions]
hint_positions_prob = 0

[game_forks]
early_fork_game_prob = 0
fork_game_prob = 0
