[muzero_training]
# Main policy CE + terminal WDL CE only, both with coefficient 1.
auxiliary_losses = false
# Plain optimizer.kind, fixed LR/decay, mean-loss backward, no Lookahead/SWA.
katago_optimizer = false
learning_rate = 0.001
weight_decay = 0.0003

[optimizer]
kind = adamw

[training]
# Preserve symmetry augmentation. MuZero unroll and hidden-gradient scaling
# are inherited. No implicit KataGo gradient clipping in plain optimizer mode.
d4_augmentation = true
gradient_clip = 0

[replay]
# Fixed window; use every row in the window (subject to shared file boundaries).
expand_per_row = 0
max_rows = 150000
keep_target_rows = all

[shuffle]
# Unrolled rows are larger than AlphaZero rows; fit the inherited memory budget.
training_shard_rows = 8192
