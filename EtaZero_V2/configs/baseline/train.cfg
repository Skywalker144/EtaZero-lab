[training]
# Baseline training budget and per-round maximum
train_steps = 2000
# Divide the actual batch budget into nonempty local segments.
sub_epochs = 1
batch_size = 128
replay_ratio = 8

# Data consumption and augmentation
d4_augmentation = true
# Each round reads at most one snapshot pass; incomplete file suffixes are dropped.

# Precision and compilation
amp = off
compile = true
gradient_clip = 0

# Batch prefetch
prefetch_depth = 2
cuda_prefetch = true

# Checkpoints
# Save every N consumed batches within this iteration; also save at its end.
checkpoint_every = 100
# Keep this many committed round-end checkpoints (including initialization).
checkpoint_keep = 5

# Validation
# Validation holds out 1% of raw filenames.
skip_validation = false
randomize_validation_files = false
# 0 is unbounded; positive caps stop after a complete batch exceeds the cap.
max_validation_samples = 0

# Loss settings
# KataGo train.py default; opponent heads additionally use the fixed 0.15 factor.
disable_optimistic_policy = false
soft_policy_weight_scale = 8

[optimizer]
# KataGo fson training policy. AdamW is an explicit alternative.
kind = sgd

# Learning rate
lr_scale = 1
lr_warmup = true
head_lr_factor = 0.5
noreg_lr_factor = 1

# Weight decay
input_wd_factor = 1
normal_wd_factor = 1
normal_attn_wd_factor = 1

# Norm statistics
norm_interval = 100
norm_only_at_print = true

# Lookahead
# In all-batch norm mode, accumulate only at the start of Lookahead cycles.
lookahead_print = false
lookahead_k = 6
lookahead_alpha = 0.5

# SWA
# 0 derives half of the baseline per-round training sample budget.
swa_period_samples = 0
swa_scale = 8

[replay]
# Window
min_rows = 150000
taper_exponent = 0.8
expand_per_row = 0.3
# 0 chooses min_rows as the taper scale; all leaves the window unbounded.
taper_scale = 0
add_to_data_rows = 0
max_rows = all

# Snapshot sampling
keep_target_rows = 20000000

[shuffle]
# Workers and memory
workers = 12
memory_mb = 16384

# Groups and output shards
group_rows = 65536
bucket_rows = 65536
training_shard_rows = 65536

# Temporary data
waves = 1
temp_dir =
compress_temp = true

# Snapshot retention
snapshot_keep = 2
